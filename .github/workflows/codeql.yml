name: CodeQL

on:
    push:
        branches: ["master"]
    pull_request:
        branches: ["master"]
    schedule:
        # Weekly scan (Monday)
        - cron: "0 6 * * 1"
    workflow_dispatch:

jobs:
    analyze:
        name: Analyze (CodeQL)
        runs-on: ubuntu-latest

        permissions:
            actions: read
            contents: read
            security-events: write

        strategy:
            fail-fast: false
            matrix:
                language: ["javascript-typescript"]

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v3
              with:
                  languages: ${{ matrix.language }}

            # Optional but helpful for better results (keeps it aligned with CI Node=20)
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install deps (npm ci)
              run: npm ci

            # If your build ever starts failing here, you can remove this step;
            # CodeQL for JS/TS can still work without building.
            - name: Build (production)
              run: npm run build

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v3
              with:
                  category: "/language:${{ matrix.language }}"

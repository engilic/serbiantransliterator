name: CodeQL

on:
    push:
        branches: ["master"]
    pull_request:
        branches: ["master"]
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

jobs:
    analyze:
        name: Analyze (CodeQL)
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write

        strategy:
            fail-fast: false
            matrix:
                language: ["javascript-typescript"]

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: ${{ matrix.language }}

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install deps (npm ci)
              run: npm ci
              env:
                  HUSKY: "0"

            - name: Perform CodeQL Analysis (generate SARIF, do not upload)
              uses: github/codeql-action/analyze@v4
              with:
                  category: "/language:${{ matrix.language }}"
                  output: sarif-results
                  upload: false

            - name: Locate SARIF file
              id: sarif
              shell: bash
              run: |
                  set -euo pipefail
                  SARIF_FILE="$(ls sarif-results/*.sarif | head -n 1)"
                  echo "file=${SARIF_FILE}" >> "$GITHUB_OUTPUT"

            - name: Filter SARIF (hard remove OOXML xmlParser false positives)
              shell: bash
              run: |
                  set -euo pipefail
                  node scripts/filter-codeql-sarif.cjs --in "${{ steps.sarif.outputs.file }}" --out "${{ steps.sarif.outputs.file }}"

            - name: Upload SARIF (filtered)
              uses: github/codeql-action/upload-sarif@v4
              with:
                  sarif_file: ${{ steps.sarif.outputs.file }}
                  category: "/language:${{ matrix.language }}"
                  wait-for-processing: true

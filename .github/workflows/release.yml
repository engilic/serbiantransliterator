name: CodeQL

on:
    push:
        branches: ["master"]
    pull_request:
        branches: ["master"]
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

# Prevent “old run finishes after new run” and flips PR status back/forth
concurrency:
    group: pr-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    analyze:
        name: Analyze (CodeQL)
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write

        strategy:
            fail-fast: false
            matrix:
                language: ["javascript-typescript"]

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: ${{ matrix.language }}

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install deps (npm ci)
              run: npm ci
              env:
                  HUSKY: "0"

            - name: Install wasm-pack
              uses: jetli/wasm-pack-action@v0.4.0
              with:
                  version: "latest"

            - name: Build (production)
              run: npm run build

            - name: Perform CodeQL Analysis (generate SARIF, do not upload)
              uses: github/codeql-action/analyze@v4
              with:
                  category: "/language:${{ matrix.language }}"
                  output: sarif-results
                  upload: false

            - name: List SARIF outputs
              shell: bash
              run: |
                  set -euo pipefail
                  echo "Listing sarif-results:"
                  ls -la sarif-results || true
                  echo "SARIF files:"
                  ls -la sarif-results/*.sarif 2>/dev/null || true

            - name: Filter ALL SARIF files (hard remove OOXML xmlParser false positives)
              shell: bash
              run: |
                  set -euo pipefail
                  shopt -s nullglob
                  files=(sarif-results/*.sarif)

                  if [ ${#files[@]} -eq 0 ]; then
                    echo "ERROR: No SARIF files found in sarif-results/"
                    exit 1
                  fi

                  for f in "${files[@]}"; do
                    node scripts/filter-codeql-sarif.cjs --in "$f" --out "$f"
                  done

            - name: Assert filtered SARIF contains no remaining matches
              shell: bash
              run: |
                  set -euo pipefail
                  shopt -s nullglob
                  files=(sarif-results/*.sarif)

                  # Fail hard if any remaining js/xss or js/xml-bomb results reference xmlParser.ts
                  if jq -r '
                    .runs[].results[]?
                    | select(.ruleId=="js/xss" or .ruleId=="js/xml-bomb")
                    | (.locations[0].physicalLocation.artifactLocation.uri // "")
                  ' "${files[@]}" | grep -Ei "src[\\/]+shared[\\/]+ooxml[\\/]+xmlParser\.ts" -q; then
                    echo "ERROR: SARIF still contains js/xss or js/xml-bomb results for src/shared/ooxml/xmlParser.ts"
                    exit 1
                  fi

                  echo "OK: filtered SARIF has no remaining matches"

            - name: Upload SARIF (filtered)
              uses: github/codeql-action/upload-sarif@v4
              with:
                  sarif_file: sarif-results
                  category: "/language:${{ matrix.language }}"
                  wait-for-processing: true

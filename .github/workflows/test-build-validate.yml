name: test-build-validate

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: test-build-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-validate:
    name: test-build-validate
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      CI: "true"
      HUSKY: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust (stable + components)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # NOTE:
      # wasm-pack is installed via npm devDependency now (npm ci), no separate action needed.

      - name: GOD1 verify (strict, fast, no-push)
        run: npm run verify:all:strict -- --fast --no-push

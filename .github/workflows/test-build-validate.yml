name: test-build-validate

on:
    push:
        branches: ["master"]
    pull_request:
        branches: ["master"]
    workflow_dispatch:

concurrency:
    group: test-build-validate-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test-build-validate:
        name: test-build-validate
        runs-on: ubuntu-latest
        timeout-minutes: 40

        env:
            CI: "true"
            HUSKY: "0"

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Setup Rust (stable + components)
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Add wasm target
              run: rustup target add wasm32-unknown-unknown

            # wasm-pack ti treba za npm run build (build:wasm)
            - name: Install wasm-pack
              uses: jetli/wasm-pack-action@v0.4.0
              with:
                  version: "latest"

            - name: GOD1 verify (strict, fast, no-push)
              run: npm run verify:all:strict -- --fast --no-push

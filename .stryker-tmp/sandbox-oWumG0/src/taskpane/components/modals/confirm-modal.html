<!-- src/taskpane/components/modals/confirm-modal.html -->

<div
    id="modalOverlay"
    class="modal-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
    aria-describedby="modalText"
    aria-hidden="true"
    style="display: none"
>
    <div id="modal" class="modal">
        <h2 id="modalTitle">Obaveštenje</h2>
        <div class="modal-content">
            <div id="modalText">Molimo potvrdite akciju.</div>
            <!-- FIX: Dodata labela za Screen Readere -->
            <label for="modalInput" class="visually-hidden">Unos teksta</label>
            <textarea id="modalInput" rows="5" placeholder="Unesite tekst ovde..."></textarea>
        </div>
        <div class="modal-actions">
            <!-- FIX: Dugmad više nisu prazna na startu -->
            <button id="modalCancel" class="secondary-btn" type="button">Otkaži</button>
            <button id="modalOk" class="primary-btn" type="button">U redu</button>
        </div>
    </div>
</div>

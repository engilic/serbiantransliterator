<!-- src/taskpane/components/settings/profile.html -->

<div id="profileBox" class="accordion fade-in">
    <button
        id="profileHeader"
        class="accordion-header"
        type="button"
        aria-expanded="true"
        aria-controls="profileContent"
    >
        <div class="accordion-header-left">
            <svg class="accordion-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path
                    d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
                />
            </svg>
            <span class="accordion-title" data-i18n="section_profile"></span>
        </div>
        <svg class="accordion-chevron" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z" />
        </svg>
    </button>

    <div id="profileContent" class="accordion-content open" style="padding: 15px">
        <select id="profilePreset" aria-label="Izbor profila" style="margin-bottom: 15px; width: 100%">
            <option value="custom" data-i18n="profile_custom"></option>
            <option value="it" data-i18n="profile_it"></option>
            <option value="finance" data-i18n="profile_finance"></option>
            <option value="medical" data-i18n="profile_medical"></option>
            <option value="legal" data-i18n="profile_legal"></option>
            <option value="marketing" data-i18n="profile_marketing"></option>
            <option value="journalism" data-i18n="profile_journalism"></option>
        </select>

        <div class="header-actions" style="justify-content: space-between; margin-bottom: 15px">
            <div style="display: flex; gap: 8px">
                <button
                    id="importBtn"
                    class="mini-btn"
                    type="button"
                    data-i18n-attr="title:btn_import_title,aria-label:btn_import_title"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
                    </svg>
                    <span data-i18n="btn_import"></span>
                </button>
                <button
                    id="exportBtn"
                    class="mini-btn"
                    type="button"
                    data-i18n-attr="title:btn_export_title,aria-label:btn_export_title"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" transform="rotate(180 12 12)" />
                    </svg>
                    <span data-i18n="btn_export"></span>
                </button>
            </div>

            <button id="resetBtn" class="mini-btn" type="button" disabled aria-label="Resetuj">
                <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                    <path
                        d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"
                    />
                </svg>
                <span data-i18n="btn_reset_factory"></span>
            </button>
        </div>

        <div style="margin-top: 15px">
            <div class="lang-group" style="display: flex; align-items: center; justify-content: flex-start">
                <div style="display: flex; align-items: center; margin-right: 10px">
                    <svg
                        viewBox="0 0 24 24"
                        width="20"
                        height="20"
                        aria-hidden="true"
                        style="fill: var(--colorBrandForeground1)"
                    >
                        <path
                            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"
                        />
                    </svg>
                </div>

                <select
                    id="optUiLanguage"
                    style="width: auto; min-width: 120px; padding: 4px 8px; font-size: 12px; height: 30px"
                    aria-label="Izbor jezika interfejsa"
                    data-i18n-attr="aria-label:opt_ui_language_aria"
                >
                    <option value="sr" data-i18n="opt_ui_language_sr"></option>
                    <option value="en" data-i18n="opt_ui_language_en"></option>
                    <option value="auto" data-i18n="opt_ui_language_auto"></option>
                </select>
            </div>
        </div>

        <input type="file" id="fileInput" accept=".json" style="display: none" />
    </div>
</div>

<div class="sticky-footer" id="stickyFooter">
    <div id="msg" role="status" aria-live="polite"></div>

    <div id="liveStatus" class="live-status fade-in" style="display: none">
        <div class="live-left">
            <span id="liveIconLeft" class="live-icon">ℹ️</span>
            <span id="liveTextLeft">...</span>
        </div>

        <div class="live-right">
            <span id="liveTextRight">...</span>

            <span
                id="liveAutoIcon"
                class="live-icon"
                style="display: none; color: var(--colorBrandForeground1); margin-left: 4px"
                title="Automatska detekcija"
            >
                <svg viewBox="0 0 20 20" width="14" height="14" fill="currentColor" aria-hidden="true">
                    <path
                        d="M10 2l2.5 5.5L18 8l-4 4 1.5 6-5.5-3-5.5 3L6 12 2 8l5.5-.5L10 2zm6-2l1 2.5 2.5 1-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1 1-2.5z"
                    />
                </svg>
            </span>

            <span id="liveIconRight" class="live-icon"></span>
            <div id="liveAscii" class="live-ascii">ASCII</div>
        </div>
    </div>

    <div class="footer-content-wrapper">
        <div class="footer-actions">
            <button id="previewBtn" class="secondary-btn" type="button">
                <span data-i18n="ui_btn_preview"></span>
            </button>
            <button id="runBtn" class="primary-btn" type="button">
                <span data-i18n="ui_btn_run"></span>
            </button>
        </div>
    </div>

    <div class="app-footer-compact">
        <a href="mailto:iddj27510@gmail.com" class="footer-icon-link" aria-label="Email" title="Kontakt">@</a>
        &bull; <a href="support.html" target="_blank" data-i18n="footer_help"></a> &bull;
        <a href="privacy.html" target="_blank" data-i18n="footer_privacy"></a> &bull;
        <a href="https://github.com/sponsors/engilic" target="_blank" data-i18n="footer_donate"></a> &bull;
        <span id="footerVersion" class="footer-version-click" title="O aplikaciji / Changelog">v1.0.0</span>
        &bull;
        <span data-i18n="footer_copyright"></span>
    </div>
</div>

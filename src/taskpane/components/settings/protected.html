<!-- src/taskpane/components/settings/protected.html -->
<div id="protectedBox" class="accordion fade-in">
    <button
        id="protectedHeader"
        class="accordion-header"
        type="button"
        aria-expanded="true"
        aria-controls="protectedContent"
    >
        <div class="accordion-header-left">
            <svg class="accordion-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path
                    d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"
                />
            </svg>
            <span class="accordion-title" data-i18n="section_protected"></span>
        </div>

        <svg
            id="protectedArrow"
            class="accordion-chevron"
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="currentColor"
            aria-hidden="true"
        >
            <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z" />
        </svg>
    </button>

    <div id="protectedContent" class="accordion-content open" style="padding: 15px">
        <div class="header-actions" style="width: 100%; display: flex; gap: 8px; margin-bottom: 12px">
            <button
                id="clearCustomBtn"
                class="mini-btn danger"
                type="button"
                data-i18n-attr="title:btn_clear_custom_title,aria-label:btn_clear_custom_title"
                style="flex: 1"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"
                    />
                </svg>
                <span data-i18n="btn_clear_custom"></span>
            </button>

            <button
                id="clearPresetBtn"
                class="mini-btn"
                type="button"
                data-i18n-attr="title:btn_clear_preset_title,aria-label:btn_clear_preset_title"
                style="flex: 1"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
                    />
                </svg>
                <span data-i18n="btn_clear_preset"></span>
            </button>

            <button
                id="clearAllBtn"
                class="mini-btn danger"
                type="button"
                data-i18n-attr="title:btn_clear_all_title,aria-label:btn_clear_all_title"
                style="flex: 1"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
                    />
                </svg>
                <span data-i18n="btn_clear_all"></span>
            </button>
        </div>

        <div class="tags-filter-container">
            <input
                type="text"
                id="tagFilterInput"
                class="tag-filter-input"
                data-i18n-attr="placeholder:tags_filter_placeholder,aria-label:tags_filter_aria"
            />
        </div>

        <div style="display: flex; gap: 8px; margin-bottom: 8px">
            <input
                type="text"
                id="tagInput"
                class="sub-input"
                autocomplete="off"
                data-i18n-attr="placeholder:tags_input_placeholder"
                aria-label="New protected word"
            />
            <button id="addTagBtn" class="mini-btn success" type="button" disabled aria-label="Add word">
                +
            </button>
        </div>

        <div class="tags-container" id="tagsContainer" role="list">
            <div class="tags-list" id="tagsList"></div>
        </div>
        <div class="hint" data-i18n="tags_hint"></div>

        <textarea id="userWordsCustom" style="display: none"></textarea>
        <textarea id="userWordsPreset" style="display: none"></textarea>
    </div>
</div>

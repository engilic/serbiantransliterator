<div class="section fade-in">
    <div class="section-header">
        <div class="section-title" data-i18n="section_protected"></div>
        <div class="header-actions">
            <button
                id="clearCustomBtn"
                class="mini-btn danger"
                type="button"
                data-i18n-attr="title:btn_clear_custom_title,aria-label:btn_clear_custom_title"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
                    />
                </svg>
                <span data-i18n="btn_clear_custom"></span>
            </button>
            <button
                id="clearPresetBtn"
                class="mini-btn"
                type="button"
                data-i18n-attr="title:btn_clear_preset_title,aria-label:btn_clear_preset_title"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-2 .89-2 2v11c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zM10 4h4v2h-4V4zm10 15H4V8h16v11z"
                    />
                </svg>
                <span data-i18n="btn_clear_preset"></span>
            </button>
            <button
                id="clearAllBtn"
                class="mini-btn danger"
                type="button"
                data-i18n-attr="title:btn_clear_all_title,aria-label:btn_clear_all_title"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
                    />
                </svg>
                <span data-i18n="btn_clear_all"></span>
            </button>
        </div>
    </div>

    <div class="tags-filter-container">
        <input
            type="text"
            id="tagFilterInput"
            class="tag-filter-input"
            data-i18n-attr="placeholder:tags_filter_placeholder,aria-label:tags_filter_aria"
        />
    </div>

    <div style="display: flex; gap: 8px; margin-bottom: 8px">
        <input
            type="text"
            id="tagInput"
            class="sub-input"
            autocomplete="off"
            data-i18n-attr="placeholder:tags_input_placeholder"
            aria-label="New protected word"
        />
        <button id="addTagBtn" class="mini-btn success" type="button" disabled aria-label="Add word">
            +
        </button>
    </div>

    <div class="tags-container" id="tagsContainer" role="list">
        <div class="tags-list" id="tagsList"></div>
    </div>
    <div class="hint" data-i18n="tags_hint"></div>

    <textarea id="userWordsCustom" style="display: none"></textarea>
    <textarea id="userWordsPreset" style="display: none"></textarea>
</div>

<div class="section fade-in">
    <div class="section-header">
        <div class="section-title" data-i18n="section_direction"></div>
    </div>

    <div role="radiogroup" aria-label="Ciljno pismo">
        <div class="direction-row">
            <label>
                <input type="radio" id="dirAuto" name="direction" value="auto" checked /><span
                    data-i18n="dir_auto"
                ></span>
            </label>
            <label>
                <input type="radio" id="dirToAscii" name="direction" value="to-ascii" /><span
                    data-i18n="dir_to_ascii_short"
                ></span>
            </label>
            <label>
                <input type="radio" id="dirLatToCyr" name="direction" value="lat-to-cyr" /><span
                    data-i18n="dir_lat_to_cyr"
                ></span>
            </label>
            <label>
                <input type="radio" id="dirCyrToLat" name="direction" value="cyr-to-lat" /><span
                    data-i18n="dir_cyr_to_lat"
                ></span>
            </label>
        </div>
    </div>

    <div style="margin-top: 15px">
        <div class="lang-group">
            <label for="optUiLanguage" class="lang-label" data-i18n="opt_ui_language_label"></label>
            <select id="optUiLanguage">
                <option value="sr" data-i18n="opt_ui_language_sr"></option>
                <option value="en" data-i18n="opt_ui_language_en"></option>
                <option value="auto" data-i18n="opt_ui_language_auto"></option>
            </select>
        </div>
        <!-- Theme Select REMOVED -->
    </div>
</div>

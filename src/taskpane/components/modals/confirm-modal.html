<div
    id="modalOverlay"
    class="modal-overlay"
    style="display: none"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
    aria-describedby="modalText"
>
    <div id="modal" class="modal">
        <h2 id="modalTitle"></h2>

        <div class="modal-content">
            <div id="modalText"></div>
            <textarea id="modalInput" style="display: none"></textarea>
        </div>

        <div class="modal-actions">
            <!-- Preview modal koristi svoj layout; ovaj apply je za legacy/confirm flows -->
            <button id="modalApply" class="mini-btn" type="button" style="display: none"></button>

            <button id="modalCancel" class="mini-btn" type="button"></button>
            <button id="modalOk" class="mini-btn" type="button"></button>
        </div>
    </div>
</div>

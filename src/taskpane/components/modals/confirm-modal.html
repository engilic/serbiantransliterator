<!-- src/taskpane/components/modals/confirm-modal.html -->
<div
    id="modalOverlay"
    class="modal-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
    aria-describedby="modalText"
>
    <div id="modal" class="modal">
        <h2 id="modalTitle"></h2>
        <div class="modal-content">
            <div id="modalText"></div>
            <textarea id="modalInput" rows="5"></textarea>
        </div>
        <div class="modal-actions">
            <button id="modalCancel" class="secondary-btn" type="button"></button>
            <button id="modalOk" class="primary-btn" type="button"></button>
        </div>
    </div>
</div>

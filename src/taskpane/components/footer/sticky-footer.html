<div class="sticky-footer" id="stickyFooter">
    <!-- Live Status Bar -->
    <div id="liveStatus" class="live-status fade-in" style="display: none">
        <div class="live-left">
            <span id="liveIconLeft" class="live-icon">ℹ️</span>
            <span id="liveTextLeft">...</span>
        </div>

        <div class="live-right">
            <span id="liveTextRight">...</span>
            <span id="liveIconRight" class="live-icon" style="margin-left: 6px"></span>
        </div>
    </div>

    <div class="footer-actions">
        <button id="previewBtn" class="secondary-btn" type="button">
            <span data-i18n="ui_btn_preview"></span>
            <div class="btn-sub" data-i18n="ui_sub_preview_selection"></div>
        </button>
        <button id="runBtn" class="primary-btn" type="button">
            <span data-i18n="ui_btn_run"></span>
            <div class="btn-sub" data-i18n="ui_sub_run_selection"></div>
        </button>
    </div>
</div>

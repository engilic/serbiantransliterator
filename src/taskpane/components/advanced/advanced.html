<div class="section fade-in">
    <div class="section-header">
        <div class="section-title" data-i18n="section_advanced"></div>
        <!-- [FIX] Dugme obrisano -->
    </div>

    <!-- [FIX] Uklonjen ID advancedSettings jer više ne togglujemo, klasa ostaje za stil -->
    <div class="advanced-settings-content">
        <div class="field-row">
            <div id="lblCurly" class="field-label">
                <span data-i18n="opt_curly_label_before"></span><code>{...}</code>
            </div>
            <select id="optCurlyProtection" aria-labelledby="lblCurly">
                <option value="placeholders" data-i18n="opt_curly_placeholders"></option>
                <option value="all" data-i18n="opt_curly_all"></option>
                <option value="none" data-i18n="opt_curly_none"></option>
            </select>
        </div>

        <label>
            <input type="checkbox" id="optProtectRomans" checked /><span
                data-i18n="opt_protect_romans"
            ></span>
        </label>
        <label>
            <input type="checkbox" id="optSetProofingLanguage" checked /><span
                data-i18n="opt_set_proofing_language"
            ></span>
        </label>

        <div class="field-row" style="margin-top: 15px">
            <label for="optDialect" class="field-label" data-i18n="opt_dialect_label"></label>
            <select id="optDialect">
                <option value="none" data-i18n="opt_dialect_none"></option>
                <option value="ekavica_to_ijekavica" data-i18n="opt_dialect_ei"></option>
                <option value="ijekavica_to_ekavica" data-i18n="opt_dialect_ie"></option>
            </select>
        </div>

        <div class="field-row" style="margin-top: 15px">
            <div id="lblSubs" class="field-label" data-i18n="opt_custom_subs_label"></div>
            <div class="subs-add-row" role="group" aria-labelledby="lblSubs">
                <input
                    type="text"
                    id="subSrc"
                    class="sub-input"
                    aria-label="Izvor"
                    data-i18n-attr="placeholder:subs_input_src_short,aria-label:subs_input_src_short"
                />

                <span class="arrow" aria-hidden="true">→</span>

                <input
                    type="text"
                    id="subDest"
                    class="sub-input"
                    aria-label="Cilj"
                    data-i18n-attr="placeholder:subs_input_dest_short,aria-label:subs_input_dest_short"
                />

                <button id="addSubBtn" class="mini-btn success" type="button" aria-label="Dodaj zamenu">
                    +
                </button>
            </div>
            <div id="subsContainer" class="subs-container">
                <div class="subs-empty hint" data-i18n="subs_list_empty"></div>
            </div>
            <textarea id="optCustomSubstitutions" style="display: none"></textarea>
        </div>
    </div>
</div>

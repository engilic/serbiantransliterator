<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Serbian Transliterator</title>
    <!-- Office.js (Obavezno) -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <style>
        /*
           FLUENT UI DIZAJN (Microsoft Style)
           Sa podrškom za Dark Mode
        */
        :root {
            /* Light Mode Default */
            --bg-color: #ffffff;
            --text-color: #323130;
            --neutral-lighter: #f3f2f1;
            --neutral-light: #edebe9;
            --border-color: #e1dfdd;
            --primary-color: #0f6cbd; /* Word Blue */
            --primary-hover: #115ea3;
            --primary-text: #ffffff;
            --input-bg: #ffffff;
            --input-border: #8a8886;
            --focus-border: #0f6cbd;
            --error-color: #a80000;
            --success-bg: #dff6dd;
            --success-text: #107c10;
        }

        /* Dark Mode (High Contrast Support) */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #262626;
                --text-color: #ffffff;
                --neutral-lighter: #333333;
                --neutral-light: #3b3a39;
                --border-color: #605e5c;
                --primary-color: #4ba0ff; /* Lighter blue for dark mode */
                --primary-hover: #2886de;
                --primary-text: #000000;
                --input-bg: #333333;
                --input-border: #a19f9d;
                --focus-border: #4ba0ff;
                --success-bg: #0b2d0b;
                --success-text: #54b054;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", "Segoe UI Web (West European)", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", sans-serif;
            font-size: 14px;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
        }

        /* Header */
        header {
            padding: 20px 20px 10px 20px;
            background-color: var(--neutral-lighter);
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            color: var(--primary-color);
        }

        .subtitle {
            margin-top: 4px;
            font-size: 12px;
            color: var(--text-color);
            opacity: 0.8;
        }

        /* Main Content */
        main {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Sections */
        .section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .section-title {
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-color);
            opacity: 0.7;
            margin-bottom: 5px;
        }

        /* Form Elements */
        label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 4px 0;
        }

        input[type="checkbox"], input[type="radio"] {
            accent-color: var(--primary-color);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        select, textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--input-border);
            border-radius: 4px; /* Fluent UI rounded corners */
            background-color: var(--input-bg);
            color: var(--text-color);
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s ease;
        }

            select:focus, textarea:focus {
                outline: none;
                border-color: var(--focus-border);
                border-bottom-width: 2px; /* Microsoft style focus */
                padding-bottom: 7px; /* Adjust for thicker border */
            }

        textarea {
            min-height: 100px;
            resize: vertical;
            font-family: "Consolas", "Monaco", monospace; /* Za kod i reči */
            font-size: 13px;
        }

        .hint {
            font-size: 11px;
            opacity: 0.7;
            margin-top: -5px;
        }

        /* Buttons */
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .full-width {
            width: 100%;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background 0.2s;
        }

        /* Primary Button (Blue) */
        #runBtn {
            background-color: var(--primary-color);
            color: var(--primary-text);
        }

            #runBtn:hover {
                background-color: var(--primary-hover);
            }

            #runBtn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

        /* Secondary Button (Standard) */
        button:not(#runBtn) {
            background-color: var(--bg-color);
            border: 1px solid var(--input-border);
            color: var(--text-color);
        }

            button:not(#runBtn):hover {
                background-color: var(--neutral-lighter);
            }

        /* Danger Button */
        #resetBtn {
            margin-top: 10px;
            color: var(--error-color);
            border-color: transparent;
            background: transparent;
            font-weight: normal;
            font-size: 12px;
            text-decoration: underline;
        }

            #resetBtn:hover {
                background-color: var(--neutral-lighter);
            }

        /* Status & Stats */
        #msg {
            padding: 10px;
            border-radius: 4px;
            background-color: var(--neutral-lighter);
            font-size: 13px;
            min-height: 20px;
        }

        #statsBox {
            display: none;
            margin-top: 10px;
            padding: 10px;
            border-left: 3px solid var(--primary-color);
            background-color: var(--neutral-lighter);
            font-size: 12px;
        }

        #statsTitle {
            font-weight: 700;
            margin-bottom: 5px;
        }

        #statsText {
            margin: 0;
            white-space: pre-wrap;
            font-family: monospace;
        }

        /* Modal (Custom Alert) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        .modal {
            background: var(--bg-color);
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
        }

            .modal h3 {
                margin-top: 0;
                color: var(--text-color);
            }

            .modal p {
                font-size: 14px;
                margin-bottom: 20px;
            }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        #modalInput {
            margin-bottom: 15px;
            display: none;
        }

        /* Code highlight */
        code {
            background: var(--neutral-lighter);
            padding: 2px 4px;
            border-radius: 3px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Serbian Transliterator</h1>
        <div class="subtitle">Pametno preslovljavanje (Lat ↔ Ćir)</div>
    </header>

    <main>
        <!-- Preset Section -->
        <div class="section">
            <div class="section-title">Podešavanja</div>
            <select id="profilePreset">
                <option value="custom">Custom (Ručno)</option>
                <option value="it">IT / Tehnologija (Štiti kod i brendove)</option>
                <option value="legal">Pravo / Administracija</option>
                <option value="journalism">Novinarstvo / Mediji</option>
            </select>
        </div>

        <!-- Direction Section -->
        <div class="section">
            <div class="section-title">Smer</div>
            <div style="display: flex; gap: 15px;">
                <label>
                    <input type="radio" id="dirAuto" name="direction" value="auto" checked />
                    Auto
                </label>
                <label>
                    <input type="radio" id="dirLatToCyr" name="direction" value="lat-to-cyr" />
                    Lat → Ćir
                </label>
                <label>
                    <input type="radio" id="dirCyrToLat" name="direction" value="cyr-to-lat" />
                    Ćir → Lat
                </label>
            </div>
        </div>

        <!-- Options Section -->
        <div class="section">
            <div class="section-title">Opcije</div>
            <label>
                <input type="checkbox" id="optProtectBrands" checked />
                Zaštiti brendove (Facebook, Windows...)
            </label>
            <label>
                <input type="checkbox" id="optSerbianQuotes" checked />
                Pametni navodnici („ … ”)
            </label>
            <label>
                <input type="checkbox" id="optPreserveCodeBlocks" checked />
                Zaštiti kod (<code>`inline`</code> i <code>```blok```</code>)
            </label>
            <label>
                <input type="checkbox" id="optConfirmWholeDoc" checked />
                Traži potvrdu za ceo dokument
            </label>
            <label>
                <input type="checkbox" id="optShowStats" />
                Prikaži detaljnu statistiku
            </label>
        </div>

        <!-- User Words Section -->
        <div class="section">
            <div class="section-title">Moje zaštićene reči</div>
            <textarea id="userWords" placeholder="Upiši reči koje se NEĆE menjati (jedna po redu).&#10;Primer:&#10;MojaFirma&#10;Excel"></textarea>
            <div class="hint">Reči ovde ostaju u originalnom pismu.</div>
        </div>

        <!-- Actions -->
        <div class="section">
            <button id="runBtn" class="full-width">
                <span>PRESLOVI</span>
            </button>

            <div class="button-group">
                <button id="previewBtn">Preview</button>
                <button id="exportBtn">Backup</button>
            </div>

            <!-- Hidden Import Btn (triggered visually differently if needed, keeping simple for now) -->
            <button id="importBtn" style="display:none;">Import</button>

            <button id="resetBtn">Vrati na fabrička podešavanja</button>
        </div>

        <!-- Status Area -->
        <div id="msg">Spreman za rad.</div>

        <!-- Stats Area -->
        <div id="statsBox">
            <div id="statsTitle">Statistika</div>
            <pre id="statsText"></pre>
        </div>
    </main>

    <!-- Modal (Hidden by default) -->
    <div id="modalOverlay" class="modal-overlay" role="dialog" aria-modal="true">
        <div id="modal" class="modal">
            <h3 id="modalTitle">Potvrda</h3>
            <p id="modalText">Tekst poruke...</p>
            <textarea id="modalInput" rows="5"></textarea>
            <div class="modal-actions">
                <button id="modalCancel">Otkaži</button>
                <button id="modalOk" style="background: var(--primary-color); color: white; border: none;">OK</button>
            </div>
        </div>
    </div>

</body>
</html>

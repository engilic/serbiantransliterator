<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Serbian Transliterator</title>
    <!-- Office.js -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #323130;
            --neutral-lighter: #f3f2f1;
            --neutral-light: #edebe9;
            --border-color: #e1dfdd;
            --primary-color: #0f6cbd;
            --primary-hover: #115ea3;
            --primary-text: #ffffff;
            --input-bg: #ffffff;
            --input-border: #8a8886;
            --focus-border: #0f6cbd;
            --error-color: #a80000;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #262626;
                --text-color: #ffffff;
                --neutral-lighter: #333333;
                --neutral-light: #3b3a39;
                --border-color: #605e5c;
                --primary-color: #4ba0ff;
                --primary-hover: #2886de;
                --primary-text: #000000;
                --input-bg: #333333;
                --input-border: #a19f9d;
                --focus-border: #4ba0ff;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", sans-serif;
            font-size: 14px;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
        }

        header {
            padding: 20px 20px 10px 20px;
            background-color: var(--neutral-lighter);
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            color: var(--primary-color);
        }

        .subtitle {
            margin-top: 4px;
            font-size: 12px;
            opacity: 0.8;
        }

        main {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* HEADER SEKCIJE SA DUGMETOM */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .section-title {
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            opacity: 0.7;
            margin: 0;
        }

        .tiny-btn {
            background: none;
            border: none;
            color: var(--error-color);
            font-size: 11px;
            cursor: pointer;
            padding: 0;
            text-decoration: underline;
        }

            .tiny-btn:disabled {
                color: var(--text-color);
                opacity: 0.4;
                cursor: default;
                text-decoration: none;
            }

            .tiny-btn:hover:not(:disabled) {
                opacity: 0.8;
            }

        label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 4px 0;
        }

        input[type="checkbox"], input[type="radio"] {
            accent-color: var(--primary-color);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            background-color: var(--input-bg);
            color: var(--text-color);
        }

            select:focus {
                outline: none;
                border-color: var(--focus-border);
                border-bottom-width: 2px;
                padding-bottom: 7px;
            }

        .hint {
            font-size: 11px;
            opacity: 0.7;
            margin-top: -5px;
        }

        /* TAGS INPUT CSS */
        .tags-container {
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            border-radius: 4px;
            padding: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-height: 80px;
            cursor: text;
        }

            .tags-container:focus-within {
                border-color: var(--focus-border);
                border-bottom-width: 2px;
                padding-bottom: 5px;
            }

        .tag {
            background-color: var(--neutral-lighter);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2px 8px 2px 10px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
        }

        .tag-remove {
            cursor: pointer;
            font-weight: bold;
            color: var(--error-color);
            font-size: 14px;
            opacity: 0.6;
        }

            .tag-remove:hover {
                opacity: 1;
            }

        .tag-input {
            border: none;
            outline: none;
            flex: 1;
            min-width: 120px;
            background: transparent;
            color: var(--text-color);
            font-size: 14px;
            padding: 4px 0;
            font-family: inherit;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .full-width {
            width: 100%;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background 0.2s;
        }

        #runBtn {
            background-color: var(--primary-color);
            color: var(--primary-text);
        }

            #runBtn:hover {
                background-color: var(--primary-hover);
            }

            #runBtn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

        button:not(#runBtn, .tiny-btn) {
            background-color: var(--bg-color);
            border: 1px solid var(--input-border);
            color: var(--text-color);
        }

            button:not(#runBtn, .tiny-btn):hover {
                background-color: var(--neutral-lighter);
            }

        #resetBtn {
            margin-top: 10px;
            color: var(--error-color);
            border-color: transparent;
            background: transparent;
            font-weight: normal;
            font-size: 12px;
            text-decoration: underline;
        }

        #msg {
            padding: 10px;
            border-radius: 4px;
            background-color: var(--neutral-lighter);
            font-size: 13px;
            min-height: 20px;
        }

        #statsBox {
            display: none;
            margin-top: 10px;
            padding: 10px;
            border-left: 3px solid var(--primary-color);
            background-color: var(--neutral-lighter);
            font-size: 12px;
        }

        #statsTitle {
            font-weight: 700;
            margin-bottom: 5px;
        }

        #statsText {
            margin: 0;
            white-space: pre-wrap;
            font-family: monospace;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        .modal {
            background: var(--bg-color);
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

            .modal h3 {
                margin-top: 0;
                color: var(--text-color);
            }

        .modal-content {
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .modal p {
            font-size: 14px;
            margin: 0;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: auto;
        }

        #modalInput {
            margin-bottom: 15px;
            display: none;
            width: 100%;
            min-height: 100px;
        }

        code {
            background: var(--neutral-lighter);
            padding: 2px 4px;
            border-radius: 3px;
            font-family: monospace;
        }

        /* DIFF STYLES */
        .diff-container {
            font-family: 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            background: var(--neutral-lighter);
            padding: 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .diff-del {
            background-color: #ffcccc;
            color: #cc0000;
            text-decoration: line-through;
            opacity: 0.8;
        }

        .diff-ins {
            background-color: #ccffcc;
            color: #006600;
            font-weight: bold;
        }

        @media (prefers-color-scheme: dark) {
            .diff-del {
                background-color: #5c0000;
                color: #ff9999;
            }

            .diff-ins {
                background-color: #004d00;
                color: #99ff99;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Serbian Transliterator</h1>
        <div class="subtitle">Pametno preslovljavanje (Lat ↔ Ćir)</div>
    </header>
    <main>
        <div class="section">
            <div class="section-title">Podešavanja</div>
            <select id="profilePreset">
                <option value="custom">Custom (Ručno)</option>
                <option value="it">IT / Tehnologija</option>
                <option value="legal">Pravo / Administracija</option>
                <option value="journalism">Novinarstvo / Mediji</option>
            </select>
        </div>
        <div class="section">
            <div class="section-title">Smer</div>
            <div style="display: flex; gap: 15px;">
                <label><input type="radio" id="dirAuto" name="direction" value="auto" checked /> Auto</label>
                <label><input type="radio" id="dirLatToCyr" name="direction" value="lat-to-cyr" /> Lat → Ćir</label>
                <label><input type="radio" id="dirCyrToLat" name="direction" value="cyr-to-lat" /> Ćir → Lat</label>
            </div>
        </div>
        <div class="section">
            <div class="section-title">Opcije</div>
            <label><input type="checkbox" id="optProtectBrands" checked /> Zaštiti brendove (Facebook, Windows...)</label>
            <label><input type="checkbox" id="optSerbianQuotes" checked /> Pametni navodnici („ … ”)</label>
            <label><input type="checkbox" id="optPreserveCodeBlocks" checked /> Zaštiti kod (<code>`inline`</code> i <code>```blok```</code>)</label>
            <label><input type="checkbox" id="optConfirmWholeDoc" checked /> Traži potvrdu za ceo dokument</label>
            <label><input type="checkbox" id="optShowStats" /> Prikaži detaljnu statistiku</label>
        </div>

        <!-- TAGS INPUT -->
        <div class="section">
            <div class="section-header">
                <div class="section-title">Moje zaštićene reči</div>
                <button id="clearTagsBtn" class="tiny-btn" disabled>Obriši sve</button>
            </div>
            <div class="tags-container" id="tagsContainer">
                <div class="tags-list" id="tagsList" style="display:contents;"></div>
                <input type="text" id="tagInput" class="tag-input" placeholder="Upiši reč i pritisni Enter..." />
            </div>
            <textarea id="userWords" style="display:none;"></textarea>
            <div class="hint">Reči ovde ostaju u originalnom pismu.</div>
        </div>

        <div class="section">
            <button id="runBtn" class="full-width"><span>PRESLOVI</span></button>
            <div class="button-group">
                <button id="previewBtn">Preview (Uporedi)</button>
                <button id="exportBtn">Backup</button>
            </div>
            <button id="importBtn" style="display:none;">Import</button>
            <button id="resetBtn">Vrati na fabrička podešavanja</button>
        </div>
        <div id="msg">Spreman za rad.</div>
        <div id="statsBox"><div id="statsTitle">Statistika</div><pre id="statsText"></pre></div>
    </main>
    <div id="modalOverlay" class="modal-overlay" role="dialog" aria-modal="true">
        <div id="modal" class="modal">
            <h3 id="modalTitle">Potvrda</h3>
            <div class="modal-content">
                <p id="modalText">Tekst poruke...</p>
                <textarea id="modalInput" rows="5"></textarea>
            </div>
            <div class="modal-actions">
                <button id="modalCancel">Otkaži</button>
                <button id="modalOk" style="background: var(--primary-color); color: white; border: none;">OK</button>
            </div>
        </div>
    </div>
</body>
</html>

[package]
name = "serbian-transliterator-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "compiler"
path = "src/bin/compiler.rs"

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.18"
bincode = "1.3"
fst = "0.4"
aho-corasick = "1.1"

# [UNIVERSE MODE] Max Optimization Flags
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-bulk-memory"]

[profile.release]
opt-level = 3       # Max speed (bilo "z" za size, ali sad idemo na speed)
lto = "fat"         # Full Link Time Optimization (sporiji build, brži kod)
codegen-units = 1   # Omogućava bolje optimizacije
panic = "abort"     # Manji binary

[package]
name = "serbian-transliterator-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# Definicija za compiler alat (helper za generisanje rečnika)
[[bin]]
name = "compiler"
path = "src/bin/compiler.rs"

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.18"
bincode = "1.3"

# === VISION 2026: WASM OPTIMIZATION ===
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory"]

[profile.release]
opt-level = "z"     # Optimizuj za VELIČINU (size), ne brzinu
lto = true          # Link Time Optimization (uklanja mrtav kod)
codegen-units = 1   # Sporije kompajliranje, ali manji binary
strip = true        # Uklanja simbole (drastično smanjuje veličinu)
panic = "abort"     # Uklanja stack unwind kod (štedi prostor)

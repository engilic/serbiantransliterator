[package]
name = "serbian-transliterator-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "compiler"
path = "src/bin/compiler.rs"

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.18"
bincode = "1.3"
fst = "0.4"
aho-corasick = "1.1"

# Safe Optimization
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O"] # Osnovna optimizacija, stabilnija

[profile.release]
opt-level = "z" # Optimize for size (brzi download, manje RAM-a)
lto = true
codegen-units = 1
strip = true
panic = "abort"
